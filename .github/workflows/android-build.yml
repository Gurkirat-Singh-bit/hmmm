name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun ci

      - name: Validate app
        run: |
          bun run typecheck
          bun run lint
          bun test

      - name: Build APK on runner
        run: eas build --platform android --profile preview --local --non-interactive --output ./hmmm.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hmmm-android
          path: ./hmmm.apk
          if-no-files-found: error
